[env]
CGO_ENABLED = 1

[tools]
golangci-lint = "2.13.2"
prek = "latest"

[tasks.test]
run = "go test -race -v ./..."

[tasks.lint]
run = "golangci-lint run --fix"

[tasks.build]
run = "go build -o dist/ ./cmd/..."

[tasks."mcp:dev"]
description = "Point this project's agent at the working tree instead of main"
run = """
claude mcp remove free-mobile-sms -s local >/dev/null 2>&1 || true
claude mcp add --scope local free-mobile-sms -- go run {{config_root}}/cmd/free-mobile-sms-mcp
echo 'dev mode: restart the agent'
"""

[tasks."mcp:release"]
description = "Go back to the main build of the server"
run = """
claude mcp remove free-mobile-sms -s local >/dev/null 2>&1 || echo 'already in release mode'
echo 'release mode: restart the agent to pick up the main build'
"""
